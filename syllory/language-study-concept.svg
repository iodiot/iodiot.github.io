  <g fill="#524638" font-family="Georgia,'Times New Roman',serif" font-size="26">
    <text x="108" y="316">She found a</text>
    <rect x="270" y="285" width="84" height="38" rx="7" fill="#8AE6CC" opacity=".7"/>
    <text x="278" y="316" font-weight="700">quiet</text>
    <text x="363" y="316">place by the</text>
    <text x="108" y="359">window and opened the letter.</text>
    <text x="108" y="435">The rain softened the sounds of</text>
    <text x="108" y="478">the street below.</text>
  </g>
  <g fill="#524638" font-family="Georgia,'Times New Roman',serif" font-size="26">
    <text x="770" y="316">Encontró un lugar</text>
