    <text x="1010" y="316" font-weight="700">tranquilo</text>
    <text x="1150" y="316">junto a</text>
    <text x="770" y="359">la ventana y abrió la carta.</text>
    <text x="770" y="435">La lluvia apagaba los sonidos de</text>
    <text x="770" y="478">la calle.</text>
  </g>

