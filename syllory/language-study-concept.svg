  <text x="390" y="624" fill="#414741" font-family="Georgia,'Times New Roman',serif" font-size="21">Calm and peaceful in this sentence — not silent.</text>
  <text x="390" y="657" fill="#79837D" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">A contextual note helps you understand why this word fits the scene.</text>
