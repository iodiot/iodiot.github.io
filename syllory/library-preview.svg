<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Syllory library preview</title>
  <desc id="desc">The Syllory library with The Impossible Man, saved reading progress, and book actions.</desc>
  <defs>
    <linearGradient id="appbg" x2="0" y2="1"><stop stop-color="#f8f6f1"/><stop offset="1" stop-color="#f0eee8"/></linearGradient>
    <linearGradient id="cover" x2="1" y2="1"><stop stop-color="#151719"/><stop offset="1" stop-color="#090b0c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#111827" flood-opacity=".22"/></filter>
  </defs>
  <rect width="1440" height="900" rx="28" fill="#22252a"/>
  <g filter="url(#shadow)">
    <rect x="22" y="22" width="1396" height="856" rx="21" fill="url(#appbg)"/>
    <path d="M22 43a21 21 0 0 1 21-21h1354a21 21 0 0 1 21 21v33H22z" fill="#5f6060"/>
    <circle cx="49" cy="49" r="8" fill="#ff625b"/><circle cx="76" cy="49" r="8" fill="#ffbd44"/><circle cx="103" cy="49" r="8" fill="#00ca4e"/>
    <text x="720" y="55" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="17" font-weight="650" fill="#f2f2f2">Syllory</text>
    <text x="72" y="151" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="34" font-weight="700" fill="#292a26">My Library</text>
    <text x="73" y="184" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="16" fill="#7c7d75">Books: 1</text>
    <rect x="1157" y="111" width="188" height="48" rx="13" fill="#657a55"/>
    <text x="1251" y="141" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="15" font-weight="650" fill="#fff">＋  Add EPUB</text>
    <rect x="1046" y="111" width="94" height="48" rx="13" fill="#fff" stroke="#d9d7d0"/>
    <text x="1093" y="141" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="14" font-weight="600" fill="#657a55">Sepia⌄</text>
    <path d="M22 211h1396" stroke="#dfddd7"/>

    <g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" transform="translate(92 248)">
      <rect width="300" height="424" rx="14" fill="url(#cover)"/>
      <path d="M22 20h256v384H22z" fill="none" stroke="#7b8790" stroke-opacity=".24"/>
      <text x="150" y="76" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="4" fill="#8bd51b">PATCHEN BARSS</text>
      <text x="150" y="173" text-anchor="middle" font-family="Arial,sans-serif" font-size="55" font-weight="800" letter-spacing="7" fill="#7ac8e9">THE</text>
      <text x="150" y="239" text-anchor="middle" font-family="Arial,sans-serif" font-size="43" font-weight="800" letter-spacing="4" fill="#7ac8e9">IMPOSSIBLE</text>
      <text x="150" y="303" text-anchor="middle" font-family="Arial,sans-serif" font-size="55" font-weight="800" letter-spacing="7" fill="#7ac8e9">MAN</text>
      <path d="M20 328c74-10 150-14 260-1" stroke="#78888d" stroke-opacity=".3"/>
      <text x="150" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#a2d52a">ROGER PENROSE</text>
      <text x="150" y="388" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#a2d52a">AND THE COST OF GENIUS</text>
      <text x="0" y="462" font-size="20" font-weight="650" fill="#292a26">The Impossible Man</text>
      <text x="0" y="491" font-size="16" fill="#77796f">Patchen Barss</text>
      <g transform="translate(0 520)">
        <circle cx="6" cy="6" r="5" fill="#d59b38"/>
        <text x="20" y="11" font-size="14" font-weight="600" fill="#a97317">Reading</text>
        <rect y="25" width="300" height="7" rx="4" fill="#d59b38" fill-opacity=".22"/>
        <rect y="25" width="59" height="7" rx="4" fill="#d59b38"/>
        <text y="57" font-size="12" fill="#77796f">Section 6 of 31 · Page 8 of 12</text>
      </g>
    </g>

    <g transform="translate(545 385)" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" filter="url(#shadow)">
      <rect width="376" height="206" rx="16" fill="#fcfbf8" stroke="#d9d5cb"/>
      <text x="24" y="42" font-size="16" font-weight="650" fill="#292a26">The Impossible Man</text>
      <path d="M20 60h336" stroke="#e8e5de"/>
      <text x="26" y="102" font-size="15" fill="#2f302c">✓  Mark as Finished</text>
      <text x="26" y="145" font-size="15" fill="#2f302c">↶  Mark as Unread</text>
      <path d="M20 163h336" stroke="#e8e5de"/>
      <text x="26" y="193" font-size="15" fill="#bf4b45">▱  Delete…</text>
    </g>
