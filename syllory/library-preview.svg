<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Syllory library preview</title>
  <desc id="desc">A Syllory library with books marked not started, reading, and finished, plus the book context menu.</desc>
  <defs>
