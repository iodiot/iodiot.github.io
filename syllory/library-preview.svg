    <linearGradient id="cover1" x2="1" y2="1"><stop stop-color="#526d69"/><stop offset="1" stop-color="#263d3d"/></linearGradient>
    <linearGradient id="cover2" x2="1" y2="1"><stop stop-color="#b78252"/><stop offset="1" stop-color="#624638"/></linearGradient>
    <linearGradient id="cover3" x2="1" y2="1"><stop stop-color="#7885a4"/><stop offset="1" stop-color="#343d58"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#111827" flood-opacity=".22"/></filter>
  </defs>
  <rect width="1440" height="900" rx="28" fill="#22252a"/>
