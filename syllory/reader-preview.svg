<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Syllory reader preview</title>
  <desc id="desc">A quiet two-page reading view with saved reading position, typography settings, and subtle navigation controls.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#18201b" flood-opacity=".19"/></filter>
    <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#f5ecd9"/><stop offset="1" stop-color="#f0e4cd"/></linearGradient>
  </defs>
  <rect width="1440" height="900" rx="28" fill="#22252a"/>
  <g filter="url(#shadow)">
    <rect x="22" y="22" width="1396" height="856" rx="21" fill="url(#paper)"/>
    <path d="M22 43a21 21 0 0 1 21-21h1354a21 21 0 0 1 21 21v33H22z" fill="#5f6060"/>
    <circle cx="49" cy="49" r="8" fill="#ff625b"/><circle cx="76" cy="49" r="8" fill="#ffbd44"/><circle cx="103" cy="49" r="8" fill="#00ca4e"/>
    <text x="720" y="55" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="17" font-weight="650" fill="#f2f2f2">Syllory Reader</text>
    <text x="70" y="130" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="17" fill="#94683f">‹  Library</text>
    <text x="197" y="124" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="19" font-weight="650" fill="#493929">A Map of Ash</text>
    <text x="197" y="148" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="13" fill="#846f59">Section 6 of 18 · Page 4 of 12</text>
    <rect x="432" y="98" width="46" height="42" rx="11" fill="#fff9ed" stroke="#d5c7ac"/>
    <text x="455" y="126" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="17" font-weight="650" fill="#94683f">Aa</text>
    <rect x="1090" y="98" width="182" height="42" rx="11" fill="#fff9ed" stroke="#d5c7ac"/>
    <rect x="1103" y="109" width="10" height="19" rx="2" fill="none" stroke="#94683f" stroke-width="1.6"/>
    <rect x="1116" y="109" width="10" height="19" rx="2" fill="none" stroke="#94683f" stroke-width="1.6"/>
    <text x="1140" y="125" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="13" font-weight="600" fill="#94683f">Two Pages⌄</text>
    <circle cx="1320" cy="119" r="20" fill="#fff9ed" stroke="#d5c7ac"/><text x="1320" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#94683f">‹</text>
    <circle cx="1370" cy="119" r="20" fill="#fff9ed" stroke="#d5c7ac"/><text x="1370" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#94683f">›</text>
    <path d="M22 171h1396" stroke="#e0d4bf"/>
    <g fill="#493929" font-family="Georgia,'Times New Roman',serif" font-size="22">
      <text x="86" y="243">The station stood at the edge of the</text>
      <text x="86" y="278">valley, where the old road bent toward</text>
      <text x="86" y="313">the river. Every morning, the first train</text>
      <text x="86" y="348">arrived with its windows full of pale</text>
      <text x="86" y="383">light, carrying people who seemed to</text>
      <text x="86" y="418">know exactly where they were going.</text>
      <text x="86" y="478">Mara had stopped asking them. She had</text>
      <text x="86" y="513">learned that a destination could be a</text>
      <text x="86" y="548">place, or simply a reason to leave.</text>

      <text x="755" y="243">On the platform, a folded map rested</text>
      <text x="755" y="278">in her coat pocket. The ink ended just</text>
      <text x="755" y="313">before the water, as though the cartographer</text>
      <text x="755" y="348">had reached the shore and chosen to</text>
      <text x="755" y="383">keep the rest to himself.</text>
      <text x="755" y="443">She opened it once more. Beyond the</text>
      <text x="755" y="478">blank edge, the river caught the morning</text>
      <text x="755" y="513">light and carried it out of sight.</text>
    </g>
    <path d="M720 202v610" stroke="#e3d7c2" stroke-width="1"/>
    <text x="395" y="824" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="13" fill="#9a8a73">78</text>
    <text x="1045" y="824" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="13" fill="#9a8a73">79</text>
  </g>
</svg>
