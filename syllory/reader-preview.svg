<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Syllory reader preview</title>
  <desc id="desc">A calm two-page reading view with a compact toolbar, saved page and section, and text that fits within the page.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#18201b" flood-opacity=".19"/></filter>
    <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#f7efdf"/><stop offset="1" stop-color="#f1e6d2"/></linearGradient>
  </defs>
  <rect width="1440" height="900" rx="28" fill="#22252a"/>
  <g filter="url(#shadow)">
    <rect x="22" y="22" width="1396" height="856" rx="21" fill="url(#paper)"/>
    <path d="M22 43a21 21 0 0 1 21-21h1354a21 21 0 0 1 21 21v33H22z" fill="#5f6060"/>
    <circle cx="49" cy="49" r="8" fill="#ff625b"/><circle cx="76" cy="49" r="8" fill="#ffbd44"/><circle cx="103" cy="49" r="8" fill="#00ca4e"/>
    <text x="720" y="55" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="17" font-weight="650" fill="#f2f2f2">Syllory Reader</text>

    <rect x="22" y="76" width="1396" height="80" fill="#fffaf0" fill-opacity=".66"/>
    <text x="67" y="116" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="16" font-weight="550" fill="#94683f">‹  Library</text>
    <path d="M170 92v47" stroke="#d5c7ac"/>
    <text x="199" y="108" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="17" font-weight="650" fill="#493929">The Impossible Man</text>
    <text x="199" y="131" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="12" fill="#846f59">Section 6 of 31 · Page 8 of 12</text>
    <rect x="435" y="94" width="36" height="34" rx="10" fill="#fffaf0" stroke="#dccdb3"/>
    <text x="453" y="117" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#94683f">◉</text>
    <rect x="1056" y="94" width="46" height="34" rx="10" fill="#fffaf0" stroke="#dccdb3"/>
    <text x="1079" y="117" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="15" font-weight="600" fill="#94683f">Aa</text>
    <rect x="1113" y="94" width="130" height="34" rx="10" fill="#fffaf0" stroke="#dccdb3"/>
    <rect x="1126" y="103" width="8" height="16" rx="2" fill="none" stroke="#94683f" stroke-width="1.5"/>
    <rect x="1136" y="103" width="8" height="16" rx="2" fill="none" stroke="#94683f" stroke-width="1.5"/>
    <text x="1151" y="116" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="11" font-weight="550" fill="#94683f">Two Pages⌄</text>
    <circle cx="1290" cy="111" r="18" fill="#f3e6d1" stroke="#d5c7ac"/><text x="1290" y="117" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#94683f">‹</text>
    <circle cx="1334" cy="111" r="18" fill="#f3e6d1" stroke="#d5c7ac"/><text x="1334" y="117" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#94683f">›</text>
    <path d="M22 156h1396" stroke="#e0d4bf"/>

    <g fill="#493929" font-family="Georgia,'Times New Roman',serif" font-size="21">
      <text x="100" y="263">The station stood at the edge of the valley,</text>
      <text x="100" y="298">where the old road bent toward the river.</text>
      <text x="100" y="333">Each morning, the first train arrived with</text>
      <text x="100" y="368">windows full of pale light, carrying people</text>
      <text x="100" y="403">who seemed to know exactly where to go.</text>
      <text x="100" y="468">Mara had stopped asking them. She had</text>
      <text x="100" y="503">learned that a destination could be a place,</text>
      <text x="100" y="538">or simply a reason to leave.</text>

      <text x="758" y="263">On the platform, a folded map rested in her</text>
      <text x="758" y="298">coat pocket. Its blue ink ended just before</text>
      <text x="758" y="333">the water, as if its maker had reached the</text>
      <text x="758" y="368">shore and chosen to keep the rest unknown.</text>
      <text x="758" y="433">She opened it once more. Beyond the blank</text>
      <text x="758" y="468">edge, the river caught the morning light</text>
      <text x="758" y="503">and carried it quietly out of sight.</text>
    </g>
    <path d="M720 226v540" stroke="#e3d7c2" stroke-width="1"/>
    <path d="M22 793h1396" stroke="#e0d4bf" stroke-opacity=".8"/>
    <text x="390" y="827" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="13" fill="#9a8a73">8</text>
    <text x="1050" y="827" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="13" fill="#9a8a73">9</text>
  </g>
</svg>
